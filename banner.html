<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Zakara International creates premium leather goods for brands through skilled craftsmanship, private labeling, and global export." />
  <title>Premium Leather Goods Manufacturer | Zakara International</title>

  <!-- Modern Clean Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Reset for preview */
    html, body {margin:0;padding:0;background:#211B17 url('assets/images/workshop-leather.webp') center/cover no-repeat fixed;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}

    /* Scoped design tokens – safe for WordPress / Elementor */
    .zakara-banner-section,
    .zakara-banner-toast {
      --bg-page:#FFFFFF;
      --bg-card:#FFFFFF;
      --text-dark:#1C1815;
      --text-muted:#665F58;
      --accent-tan:#965B34;
      --accent-dark:#1E1A17;
      --border-subtle:#ECE6DD;
      --radius-sm:8px;
      --radius-md:14px;
      --radius-lg:20px;
      --radius-full:9999px;
      --transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1);
      --font-main:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    }

    .zakara-banner-section,
    .zakara-banner-section *,
    .zakara-banner-section *::before,
    .zakara-banner-section *::after {
      box-sizing:border-box;
      font-family:var(--font-main);
      -webkit-font-smoothing:antialiased;
    }

    .zakara-banner-section h2,
    .zakara-banner-section p,
    .zakara-banner-section a {margin:0;padding:0;}
    .zakara-banner-section a {color:inherit;text-decoration:none !important;box-shadow:none !important;border:none;transition:var(--transition);} 
    .zakara-banner-section a:hover,.zakara-banner-section a:focus {text-decoration:none !important;box-shadow:none !important;}

    .zakara-banner-section {width:100%;background:transparent;}
    .zakara-banner-wrapper {width:100%;background:transparent !important;border:none !important;box-shadow:none !important;padding:24px 0;box-sizing:border-box;}
    .zakara-banner-inner {max-width:1240px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:1fr 290px;gap:40px;align-items:center;background:transparent !important;box-sizing:border-box;}
    .zk-text-block {display:flex;flex-direction:column;background:transparent !important;}
    .zk-welcome {font-size:15px;font-weight:600;color:#C27D48;letter-spacing:0.5px;margin-bottom:4px;text-transform:capitalize;}
    .zk-main-heading {font-size:34px;font-weight:800;letter-spacing:-0.3px;color:#FFFFFF;line-height:1.2;margin:0 0 6px 0;}
    .zk-sub-heading {font-size:14.5px;font-weight:600;color:#E6DFD5;margin-bottom:12px;letter-spacing:0.2px;}
    .zk-paragraph {font-size:13.5px;color:#C8C2BA;line-height:1.6;max-width:680px;margin:0 0 16px 0;}
    .zk-points-list {display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;background:transparent !important;}
    .zk-point-item {display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:#FFFFFF;line-height:1.4;}
    .zk-dot {width:6px;height:6px;border-radius:50%;background-color:#C27D48;flex-shrink:0;display:inline-block;}
    .zk-point-item.zk-export {font-size:12.5px;font-weight:500;color:#D2CBC4;}
    .zk-point-item.zk-export strong {color:#FFFFFF;font-weight:600;}
    .zk-trust-card {background:#FFFFFF !important;border-radius:18px;padding:22px 18px 20px;width:100%;max-width:270px;box-shadow:0 14px 34px -4px rgba(0,0,0,0.45);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1);}
    .zk-trust-card:hover {transform:translateY(-4px);}
    .zk-trust-card img {width:165px;height:auto;object-fit:contain;display:block;margin:0 auto;}
    @media (max-width:960px) { .zakara-banner-inner {grid-template-columns:1fr 240px;gap:28px;} .zk-main-heading {font-size:28px;} .zk-trust-card img {width:140px;}}
    @media (max-width:720px) { .zakara-banner-inner {grid-template-columns:1fr;gap:24px;text-align:center;} .zk-points-list {align-items:center;} .zk-point-item {justify-content:center;}}
  </style>
</head>
<body>
  <section class="zakara-banner-section">
    <div class="zakara-banner-wrapper">
      <div class="zakara-banner-inner">
        <!-- Your original banner markup goes here -->
        <!-- Example placeholders – replace with your content -->
        <div class="zk-text-block">
          <div class="zk-welcome">Welcome</div>
          <h1 class="zk-main-heading">Zakara International Leather Goods</h1>
          <div class="zk-sub-heading">Premium Leather Solutions</div>
          <p class="zk-paragraph">Crafted with tradition and innovation.</p>
          <ul class="zk-points-list">
            <li class="zk-point-item"><span class="zk-dot"></span> Hand‑stitched quality</li>
            <li class="zk-point-item"><span class="zk-dot"></span> Sustainable sourcing</li>
            <li class="zk-point-item zk-export"><strong>12+ years</strong> of trust worldwide</li>
          </ul>
        </div>
        <div class="zk-card-wrap">
          <div class="zk-trust-card">
            <img src="assets/images/12-years-badge.png" alt="12+ years of trust badge" />
            <p>Trusted by leading brands</p>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div id="bannerToast" class="zakara-banner-toast" role="status" aria-live="polite"></div>
</body>
</html>
