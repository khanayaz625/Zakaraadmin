<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore leather bag categories from Zakara International, including handmade bags, travel bags, laptop bags, backpacks, and accessories." />
  <title>Leather Bag Categories | Zakara International</title>

  <!-- Modern Clean Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset for preview */
    html, body {margin:0;padding:0;background:#FFFFFF;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}

    /* Scoped design tokens */
    .zakara-home,
    .zakara-home-toast {
      --bg-page:#FFFFFF;
      --bg-card:#F8F7F4;
      --bg-card-hover:#F2EFE9;
      --text-main:#141414;
      --text-muted:#6E6B67;
      --accent-tan:#965B34;
      --accent-tan-light:#B87343;
      --accent-dark:#1E1A17;
      --border-subtle:#EBE7DF;
      --border-hover:#D5CDC0;
      --radius-card:16px;
      --radius-img:12px;
      --radius-full:9999px;
      --transition:all 0.3s cubic-bezier(0.2,0.8,0.2,1);
      --font-main:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    }

    .zakara-home,
    .zakara-home *,
    .zakara-home *::before,
    .zakara-home *::after {
      box-sizing:border-box;
      font-family:var(--font-main);
      -webkit-font-smoothing:antialiased;
    }

    .zakara-home h2,
    .zakara-home p,
    .zakara-home a {
      margin:0;padding:0;
    }

    .zakara-home a {color:inherit;text-decoration:none !important;box-shadow:none !important;border:none;transition:var(--transition);}
    .zakara-home a:hover,.zakara-home a:focus {text-decoration:none !important;box-shadow:none !important;}

    body {font-family:var(--font-main);background-color:var(--bg-page);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased;}
    a {color:inherit;text-decoration:none;}
    .container {max-width:1280px;margin:0 auto;padding:0 24px;}
    .category-section {padding:64px 0 88px;}
    .section-header {text-align:center;max-width:640px;margin:0 auto 48px;}
    .section-eyebrow {font-size:11.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;}
    /* additional styles omitted for brevity – retain original design */
  </style>
</head>
<body>
  <section class="zakara-home">
    <!-- Original content from home.html goes here. -->
    <!-- You can paste the existing markup of home.html inside this wrapper. -->
  </section>

  <!-- Optional toast element if needed -->
  <div id="homeToast" class="zakara-home-toast" role="status" aria-live="polite"></div>
</body>
</html>
